services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: file:/data/jazba.db
      STORAGE_DIR: /storage
      SITE_URL: ${SITE_URL:?Set the public HTTPS origin}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set a random secret}
      COOKIE_SECURE: "true"
    volumes:
      - jazba_data:/data
      - jazba_files:/storage
    restart: unless-stopped
volumes:
  jazba_data:
  jazba_files:
